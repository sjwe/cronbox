[project]
name = "cronbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=4.0.0a1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "docker>=7.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "fastmcp>=2.0",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
]

[project.scripts]
cronbox = "cronbox.cli:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
