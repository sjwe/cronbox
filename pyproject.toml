[project]
name = "cronbox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=4.0.0a1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "docker>=7.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "fastmcp>=2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
