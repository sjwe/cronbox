services:
  cronbox:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - CRONBOX_DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - CRONBOX_WEB_BASE_URL=${WEB_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
